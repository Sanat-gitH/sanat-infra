name: infra_pipe_line

on:
  push:
    branches: ["main"]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Hello
        run: echo "Hello, world!"

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Check Azure Login
        run: az account show

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Version
        run: terraform version

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: |
          Write-Host "===== TERRAFORM VALIDATE START ====="
          terraform validate
          Write-Host "===== TERRAFORM VALIDATE END ====="

      - name: Terraform Plan
        env:
          ARM_USE_OIDC: true
        run: |
          Write-Host "===== TERRAFORM PLAN START ====="
          terraform plan
          Write-Host "===== TERRAFORM PLAN END ====="
